services:

  home:
    image: home:4.0
    ports:
      - "3000:80"
    container_name: home

  usuarios:
    image: alpine
    container_name: usuarios

  productos:
    image: alpine
    container_name: productos

  pedidos:
    image: alpine
    container_name: pedidos

  mysqlpedidos:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pedidos
    ports:
      - "3306:3306"
    volumes:
      - mysqlpedidos:/var/lib/mysql

volumes:
  mysqlpedidos: