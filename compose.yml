services:

  home:
    build: ./home
    image: home:4.0
    ports:
      - "3000:80"
    container_name: home

  usuarios:
    build: ./usuarios
    container_name: usuarios
    ports:
      - "5001:5000"  
    env_file:
    - .env  

  productos:
    build: ./productos
    container_name: productos
    ports:
      - "5002:5000"  
    env_file:
    - .env

  pedidos:
    build: ./pedidos
    container_name: pedidos
    ports:
      - "5003:5000"  
    env_file:
    - .env     

  mysqlpedidos:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pedidos_db
    ports:
      - "3306:3306"
    volumes:
      - pedidos_data:/var/lib/mysql

  mysqlproductos:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: productos_db
    ports:
      - "3307:3306"
    volumes:
      - productos_data:/var/lib/mysql

  mysqlusuarios:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: usuarios_db
    ports:
      - "3308:3306"
    volumes:
      - usuarios_data:/var/lib/mysql        

volumes:
  pedidos_data:
  productos_data:
  usuarios_data: